<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RecipeBook | Find a Recipe</title>
  <meta name="description" content="RecipeBook: simple, delicious recipes you can find fast.">

  <meta property="og:type" content="website">
  <meta property="og:title" content="RecipeBook | Find a Recipe">
  <meta property="og:description" content="Simple, delicious recipes you can find fast.">
  <meta property="og:url" content="https://githubusername.github.io/wdd131/recipes/">
  <meta property="og:image" content="images/social-preview-image.png"> <!-- 1200x630px -->

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="RecipeBook | Find a Recipe">
  <meta name="twitter:description" content="Simple, delicious recipes you can find fast.">
  <meta name="twitter:image" content="images/social-preview-image.png">

  <link rel="icon" href="favicon.ico">

  <link rel="apple-touch-icon" href="images/apple-touch-icon.png"> <!-- 180x180px -->

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="recipes.css">
  <script src="recipes.js" defer></script>
</head>
<body>

  <header class="site-header">
    <img src="images/recipeicon.png" alt="Recipe book icon" class="logo">
    <h1>RecipeBook</h1>
  </header>

  <main>
    <div class="search-area">
      <form class="search" role="search" action="#">
        <label for="search" class="visually-hidden">Find a recipe</label>
        <input type="search" id="search" name="search" placeholder="Find a recipe">
        <button type="submit" aria-label="Search">
          <img src="images/magnafyingglass.png" alt="">
        </button>
      </form>
    </div>

    <section id="recipes" aria-live="polite"></section>
  </main>

  <footer class="site-footer">
    <a href="https://www.flaticon.com/free-icons/recipe" title="recipe icons">Recipe icons created by Freepik - Flaticon</a>
    <div class="social">
      <img src="images/icons.png" alt="Instagram, YouTube and Pinterest icons">
    </div>
  </footer>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RecipeBook | Apple Crisp</title>
  <meta name="description" content="RecipeBook: simple, delicious recipes you can find fast.">

  <!-- Open Graph (Facebook, LinkedIn, etc.) -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="RecipeBook | Apple Crisp">
  <meta property="og:description" content="Simple, delicious recipes you can find fast.">
  <meta property="og:url" content="https://yourusername.github.io/recipes/">
  <meta property="og:image" content="images/social-preview-image.png"> <!-- 1200x630px -->

  <!-- X Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="RecipeBook | Apple Crisp">
  <meta name="twitter:description" content="Simple, delicious recipes you can find fast.">
  <meta name="twitter:image" content="images/social-preview-image.png">

  <!-- One favicon (ICO works everywhere) -->
  <link rel="icon" href="/favicon.ico">

  <!-- One Apple Touch Icon (iOS home screen) -->
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png"> <!-- 180x180px -->

  <!-- Amatic SC from Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="recipes.css">
</head>
<body>

  <header class="site-header">
    <img src="images/recipeicon.png" alt="Recipe book icon" class="logo">
    <h1>RecipeBook</h1>
  </header>

  <main>
    <div class="search-area">
    <form class="search" role="search" action="#">
      <label for="search" class="visually-hidden">Find a recipe</label>
      <input type="search" id="search" name="search" placeholder="Find a recipe">
      <button type="submit" aria-label="Search">
        <img src="images/magnafyingglass.png" alt="">
      </button>
    </form>
    </div>

    <article class="recipe">
      <img src="images/apple-crisp.jpg" alt="A bowl of apple crisp topped with vanilla ice cream" class="recipe-img">
      <div class="recipe-info">
        <span class="tag">dessert</span>
        <h2>Apple Crisp</h2>
        <span
          class="rating"
          role="img"
          aria-label="Rating: 4 out of 5 stars"
        >
          <span aria-hidden="true" class="icon-star">⭐</span>
          <span aria-hidden="true" class="icon-star">⭐</span>
          <span aria-hidden="true" class="icon-star">⭐</span>
          <span aria-hidden="true" class="icon-star">⭐</span>
          <span aria-hidden="true" class="icon-star-empty">☆</span>
        </span>
        <p class="description">This apple crisp recipe is a simple yet delicious fall dessert that's great served warm with vanilla ice cream.</p>
      </div>
    </article>
  </main>

  <footer class="site-footer">
    <a href="https://www.flaticon.com/free-icons/recipe" title="recipe icons">Recipe icons created by Freepik - Flaticon</a>
    <div class="social">
      <!-- Social media icons provided under CC from https://www.iconfinder.com/AlfredoCreates  -->
      <img src="images/icons.png" alt="Instagram, YouTube and Pinterest icons">
    </div>
  </footer>

</body>
</html>
